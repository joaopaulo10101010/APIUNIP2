<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <h1>Editar aluno</h1>

    <form method="POST">
        <label>Nome:</label>
        <input type="text" name="nome" value="" required>
        <br><br>
        <label>Email:</label>
        <input type="email" name="email" value="" required>
        <br><br>
        <label>Curso:</label>
        <input type="text" name="curso" value="" required>
        <br><br>
        <button type="submit">Salvar</button>
    </form>

    <table> 
 
        <tr> 
            <th>ID</th> 
            <th>Nome</th> 
            <th>Email</th> 
            <th>Curso</th> 
        </tr> 
    
        {% for aluno in alunos %} 
        <tr> 
            <td>{{ aluno["id"] }}</td> 
            <td>{{ aluno["nome"] }}</td> 
            <td>{{ aluno["email"] }}</td> 
            <td>{{ aluno["curso"] }}</td> 
        </tr> 
        {% endfor %} 
 
    </table>
</body>
</html>
